services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Loopback-only, for convenience (e.g. curl-ing from the host directly)
      # — this is *not* how NPM reaches the app, see the `proxy` network
      # below. A bare "3000:3000" would bind 0.0.0.0 and be reachable
      # directly from the internet, bypassing the reverse proxy entirely.
      - "127.0.0.1:3000:3000"
    networks:
      # `default`: talks to `db` (see DATABASE_URL below). `proxy`: an
      # external network shared with the nginx-proxy-manager container,
      # already running on this host outside this compose project — joining
      # it is what lets NPM forward to this container by name instead of a
      # bridge-network IP that isn't stable across recreates.
      - default
      - proxy
    environment:
      # Quoted throughout: several of the ${VAR:?message} fallback messages
      # below contain colons, which an unquoted YAML scalar would parse as
      # the start of a nested mapping rather than plain text.
      DATABASE_URL: "postgresql://roomtone:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/roomtone?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env, e.g. via openssl rand -hex 32}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to your real domain, e.g. https://roomtone.example.com}"
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-qwen2.5-coder:3b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_CHAT_MODEL: "${OPENROUTER_CHAT_MODEL:-meta-llama/llama-3.1-8b-instruct:free}"
      # "memory" is correct for this single-container compose file. Only
      # switch to "postgres" if you're running more than one app container
      # behind a load balancer — see lib/realtime/postgres-hub.ts.
      REALTIME_ADAPTER: "${REALTIME_ADAPTER:-memory}"
      NODE_ENV: production
    extra_hosts:
      # Lets the container reach an Ollama instance running on the host
      # machine via the OLLAMA_BASE_URL default above. Harmless no-op if
      # AI_PROVIDER isn't "ollama".
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off: applies pending migrations, then exits. Runs from the `builder`
  # Dockerfile stage (the full `npm ci` node_modules) rather than the lean
  # `runner` image `app` uses — the Prisma CLI's own dependency tree
  # (@prisma/config pulls in packages like `effect`) doesn't line up with
  # what `next build`'s file-tracing decides the *running app* needs, so
  # trying to hand-pick a Prisma-sized subset into the runner image is a
  # real (previously hit) footgun. `app` won't start until this exits 0.
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy", "--config", "prisma7.config.ts"]
    restart: "no"
    networks:
      - default
    environment:
      DATABASE_URL: "postgresql://roomtone:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/roomtone?schema=public"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_USER: roomtone
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      POSTGRES_DB: roomtone
    # No `ports:` mapping — unlike compose.dev.yaml, the database is only
    # reachable from the `app` service over the internal compose network,
    # not from the host.
    volumes:
      - roomtone_prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomtone -d roomtone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomtone_prod_db_data:

networks:
  default: {}
  # Pre-existing network the nginx-proxy-manager container is already on
  # (created outside this compose project) — external: true tells compose
  # not to try to create or own it, just join it.
  proxy:
    external: true
